apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-sre-lab
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/dp529/fastapi-sre-lab.git
    targetRevision: main
    path: helm/fastapi-sre-lab
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: fastapi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
