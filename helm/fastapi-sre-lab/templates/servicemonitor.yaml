apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "fastapi-sre-lab.fullname" . }}
  labels:
    release: kube-prometheus-stack
    {{- include "fastapi-sre-lab.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fastapi-sre-lab.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
